# PROPOSAL ONLY. This file is deliberately NOT in .github/workflows, so it never runs.
# To adopt it: resolve every "TODO(owner)" below, copy it to .github/workflows/ci.yml, and push to a branch.
#
# Design (matches the project's own CI plan, lanes A and B):
#   - Runs on pull requests and pushes to main. Never uses pull_request_target, so code from forks runs with a
#     read-only token and no secrets.
#   - Least privilege: the workflow token can only read the repository contents.
#   - Every third-party action must be pinned to a full commit SHA (TODO markers below). Dependabot
#     (docs/open-source/proposed/dependabot.yml) then proposes updates to those pins.
#   - The "app bundle" gate is not run here: it needs the maintainer's signing identity, which must never be given
#     to a workflow that runs pull-request code. Signed builds belong in a separate, environment-protected release
#     workflow (lane D), added later.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm:
    name: Build and test (SwiftPM)
    # TODO(owner): Xcode 27.1 needs a macOS 26-or-later host. Confirm in actions/runner-images that this image
    # carries Xcode 27.1 before adopting; if it does not, do not fall back to an older Xcode (make ci pins 27.1).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # TODO(owner): replace with actions/checkout pinned to the full commit SHA of a release you have verified,
      # keeping the version as a trailing comment, e.g.  uses: actions/checkout@<40-char sha> # vX.Y.Z
      - uses: actions/checkout@TODO-PIN-FULL-COMMIT-SHA
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        # TODO(owner): confirm the install path on the runner image.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      # TODO(owner): replace with actions/cache pinned to a full commit SHA.
      - uses: actions/cache@TODO-PIN-FULL-COMMIT-SHA
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode27.1-${{ hashFiles('Package.resolved') }}

      - name: Strict build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors --only-use-versions-from-resolved-file

      - name: Tests
        run: swift test --skip-build

  gates:
    name: Source and helper gates
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@TODO-PIN-FULL-COMMIT-SHA
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      # TODO(owner): needs a small Stage B change to scripts/ci.sh so a gate can be skipped, e.g.
      #   scripts/ci.sh --skip "app bundle"
      # Until then this step would fail at the app-bundle gate on any machine without the signing identity.
      # The other gates (toolchain, helper linkage, networking only in Sync, clock injected, design tokens,
      # redaction audit, secret scan) need no secrets.
      - name: make ci without the signed app bundle
        run: scripts/ci.sh --skip "app bundle"

      - name: Keep gate logs
        if: always()
        # TODO(owner): replace with actions/upload-artifact pinned to a full commit SHA.
        uses: actions/upload-artifact@TODO-PIN-FULL-COMMIT-SHA
        with:
          name: ci-logs
          path: .build/ci-logs/
          retention-days: 7
