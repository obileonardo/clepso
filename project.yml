# Generates Pulse.xcodeproj (gitignored). Package.swift stays the source of truth for all code.
# Run: scripts/bootstrap.sh && .tools/xcodegen/bin/xcodegen   (or: make app)
name: Pulse
options:
  bundleIdPrefix: dev.tokone          # placeholder until the final bundle identifier prefix is chosen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Signing and the optional accounts project come from Config/Pulse.xcconfig, which includes the uncommitted
# Config/*.local.xcconfig files when they exist. Without them: ad-hoc signing and Sync off.
configFiles:
  Debug: Config/Pulse.xcconfig
  Release: Config/Pulse.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: $(PULSE_DEVELOPMENT_TEAM)          # empty unless Config/Signing.local.xcconfig sets it
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: $(PULSE_CODE_SIGN_IDENTITY)      # "-" (ad hoc) unless Config/Signing.local.xcconfig sets it
    ENABLE_HARDENED_RUNTIME: YES       # on every target
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Clepso:
    path: .
targets:
  PulseMac:
    type: application
    platform: macOS
    sources: [App/PulseMac]
    info:
      path: App/PulseMac/Info.plist
      properties:
        CFBundleName: Clepso
        CFBundleDisplayName: Clepso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true              # menu bar only: no Dock icon, no main menu
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:              # optional accounts: the sign-in link returns to dev.tokone.pulse://auth-callback
          - CFBundleURLName: dev.tokone.pulse.auth
            CFBundleURLSchemes: [dev.tokone.pulse]
        PulseSyncHost: $(PULSE_SYNC_HOST)                        # empty in builds from source: Sync stays off
        PulseSyncPublishableKey: $(PULSE_SYNC_PUBLISHABLE_KEY)
    entitlements:
      path: App/PulseMac/PulseMac.entitlements
      properties: {}                   # empty: no sandbox (Pulse edits ~/.claude), no network entitlement, no exceptions
    settings:
      base:
        PRODUCT_NAME: Clepso
        PRODUCT_BUNDLE_IDENTIFIER: dev.tokone.pulse
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # 1.16: the Pulse mark (design/brand/app-icon)
    dependencies:
      - package: Clepso
        product: PulseApp
      - target: pulse-statusline
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  pulse-statusline:
    type: tool
    platform: macOS
    sources: [Sources/pulse-statusline]
    settings:
      base:
        PRODUCT_NAME: pulse-statusline
        PRODUCT_BUNDLE_IDENTIFIER: dev.tokone.pulse.statusline   # <bundle-prefix>.pulse.statusline
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES        # embedded __info_plist: codesign then uses the bundle id as the identifier,
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES   # which a code-signing peer check can require (PRIVACY_AND_SECURITY §3)
    dependencies:
      - package: Clepso
        product: StatusLineShim
