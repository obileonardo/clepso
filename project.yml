# Generates Clepso.xcodeproj (gitignored). Package.swift stays the source of truth for all code.
# Run: scripts/bootstrap.sh && .tools/xcodegen/bin/xcodegen   (or: make app)
name: Clepso
options:
  bundleIdPrefix: com.elvisobi        # decided 18 Oct 2026 (A7): a domain the maintainer owns
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Signing and the optional accounts project come from Config/Clepso.xcconfig, which includes the uncommitted
# Config/*.local.xcconfig files when they exist. Without them: ad-hoc signing and Sync off.
configFiles:
  Debug: Config/Clepso.xcconfig
  Release: Config/Clepso.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: $(CLEPSO_DEVELOPMENT_TEAM)          # empty unless Config/Signing.local.xcconfig sets it
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: $(CLEPSO_CODE_SIGN_IDENTITY)      # "-" (ad hoc) unless Config/Signing.local.xcconfig sets it
    ENABLE_HARDENED_RUNTIME: YES       # on every target
    MARKETING_VERSION: 0.4.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Clepso:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
# Stable CLI/archive scheme in every fresh checkout, without relying on Xcode's user-local auto-created schemes.
schemes:
  ClepsoPhone:
    build:
      targets:
        ClepsoPhone: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ClepsoPhoneTests]
  ClepsoWatch:
    build:
      targets:
        ClepsoWatch: all
    run:
      config: Debug
  ClepsoMac:
    build:
      targets:
        ClepsoMac: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  ClepsoMac:
    type: application
    platform: macOS
    sources:
      - App/ClepsoMac
      - path: LICENSE                  # Clepso's own licence ships beside Acknowledgements.txt (Contents/Resources)
        buildPhase: resources
      - path: mod/claude-code          # v0.3: the Claude Code mod, copied whole to Contents/Resources/claude-code
        type: folder                   # (docs/specs/mod-bridge.md §3); make ci checks it matches the source byte for byte
        buildPhase: resources
    info:
      path: App/ClepsoMac/Info.plist
      properties:
        CFBundleName: Clepso
        CFBundleDisplayName: Clepso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true              # menu bar only: no Dock icon, no main menu
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:              # optional accounts: the sign-in link returns to clepso://auth-callback
          - CFBundleURLName: com.elvisobi.clepso.auth
            CFBundleURLSchemes: [clepso]
        ClepsoSyncHost: $(CLEPSO_SYNC_HOST)                        # empty in builds from source: Sync stays off
        ClepsoSyncPublishableKey: $(CLEPSO_SYNC_PUBLISHABLE_KEY)
        ClepsoSyncProviders: $(CLEPSO_SYNC_PROVIDERS)
        ClepsoWidgetGroup: $(CLEPSO_WIDGET_GROUP)
        SUFeedURL: https://clepso-app.vercel.app/updates/appcast.xml
        SUPublicEDKey: WeaRornZqBUmFaOutT62FtvopukvrlEZPCEiapwbCpk=
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: true
        SUSendProfileInfo: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: App/ClepsoMac/ClepsoMac.entitlements
      properties:
        com.apple.security.application-groups: [$(CLEPSO_WIDGET_GROUP)]
    settings:
      base:
        PRODUCT_NAME: Clepso
        PRODUCT_BUNDLE_IDENTIFIER: com.elvisobi.clepso
        ENABLE_APP_SANDBOX: NO
        ARCHS: arm64                   # DECISIONS C4: Apple silicon only for the app in alpha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # 1.16: the Clepso mark (design/brand/app-icon)
    dependencies:
      - package: Clepso
        product: ClepsoApp
      - package: Sparkle
        product: Sparkle
      - target: ClepsoWidgets
        embed: true
        codeSign: true
      - target: clepso-statusline
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: clepso
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
  clepso:
    type: tool
    platform: macOS
    sources: [Sources/clepso]
    settings:
      base:
        PRODUCT_NAME: clepso
        PRODUCT_BUNDLE_IDENTIFIER: com.elvisobi.clepso.cli
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    dependencies:
      - package: Clepso
        product: ClaudeCodeAdapter
      - package: Clepso
        product: ClepsoMCP
  ClepsoWidgets:
    type: app-extension
    platform: macOS
    sources: [App/ClepsoWidgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elvisobi.clepso.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        ARCHS: arm64
    info:
      path: App/ClepsoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Clepso
        ClepsoWidgetGroup: $(CLEPSO_WIDGET_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/ClepsoWidgets/ClepsoWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(CLEPSO_WIDGET_GROUP)]
    dependencies:
      - package: Clepso
        product: IntegrationSnapshot
      - package: Clepso
        product: DesignSystem
  clepso-statusline:
    type: tool
    platform: macOS
    sources: [Sources/clepso-statusline]
    settings:
      base:
        PRODUCT_NAME: clepso-statusline
        PRODUCT_BUNDLE_IDENTIFIER: com.elvisobi.clepso.statusline   # <bundle-prefix>.clepso.statusline
        SKIP_INSTALL: YES
        ARCHS: $(ARCHS_STANDARD)            # DECISIONS C4: universal (arm64 x86_64), Claude Code may run it under Rosetta
        GENERATE_INFOPLIST_FILE: YES        # embedded __info_plist: codesign then uses the bundle id as the identifier,
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES   # which a code-signing peer check can require (PRIVACY_AND_SECURITY §3)
    dependencies:
      - package: Clepso
        product: StatusLineShim

  ClepsoPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/ClepsoPhone
      - App/CompanionShared
    info:
      path: App/ClepsoPhone/Info.plist
      properties:
        CFBundleDisplayName: Clepso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.elvisobi.clepso.mobile.auth
            CFBundleURLSchemes: [clepso]
        ClepsoSyncHost: $(CLEPSO_SYNC_HOST)
        ClepsoSyncPublishableKey: $(CLEPSO_SYNC_PUBLISHABLE_KEY)
        ClepsoPushEnvironment: $(CLEPSO_PUSH_ENVIRONMENT)
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elvisobi.clepso.mobile
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLEPSO_PUSH_ENVIRONMENT: development
    entitlements:
      path: App/ClepsoPhone/ClepsoPhone.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: Clepso
        product: DesignSystem
      - package: Clepso
        product: Domain
      - package: Clepso
        product: Sync
      - package: Clepso
        product: IntegrationSnapshot
      - target: ClepsoWatch
        embed: true
  ClepsoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - App/ClepsoWatch
      - App/CompanionShared
    info:
      path: App/ClepsoWatch/Info.plist
      properties:
        CFBundleDisplayName: Clepso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.elvisobi.clepso.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elvisobi.clepso.mobile.watchapp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Clepso
        product: DesignSystem
      - package: Clepso
        product: Domain
      - package: Clepso
        product: IntegrationSnapshot
  ClepsoPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/PhoneTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elvisobi.clepso.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ClepsoPhone
      - package: Clepso
        product: Sync
      - package: Clepso
        product: IntegrationSnapshot
