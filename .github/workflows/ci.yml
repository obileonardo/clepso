# Hosted CI (adopted 18 Oct 2026 from the Stage A proposal; see docs/open-source/GITHUB_SETTINGS.md §2).
#
#   - Runs on pull requests and pushes to main. Never uses pull_request_target, so code from forks runs with a
#     read-only token and no secrets.
#   - Least privilege: the workflow token can only read the repository contents.
#   - Every action is pinned to a full commit SHA (version in the trailing comment); Dependabot (.github/dependabot.yml)
#     proposes updates to those pins.
#   - Gates run in contributor mode (scripts/ci.sh --contributor): ad-hoc signing and no accounts project, so the
#     workflow needs no secrets at all. The maintainer's signing identity and accounts project must never be given to
#     a workflow that runs pull-request code; signed builds belong in a separate, environment-protected release
#     workflow, added later.
#   - Runner: GitHub's `xcode-27` image (public preview, macOS 27) is the only hosted image with Xcode 27.1, which
#     make ci pins (build 27A9275, checked 18 Oct 2026 in actions/runner-images). Never fall back to an older Xcode.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm:
    name: Build and test (SwiftPM)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          swift --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode27.1-${{ hashFiles('Package.resolved') }}

      - name: Strict build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors --only-use-versions-from-resolved-file

      - name: Tests
        run: swift test --skip-build

  gates:
    name: Quality gates (contributor mode)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      # Every gate, including the ad-hoc-signed app bundle; no secrets needed.
      - name: make ci-contributor
        run: scripts/ci.sh --contributor

      - name: Keep gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs
          path: .build/ci-logs/
          retention-days: 7
