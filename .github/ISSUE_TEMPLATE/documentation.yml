name: Documentation
description: Something in the README, guides or documentation site is wrong, unclear or missing.
labels: ["documentation", "triage"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File and section, or the page on the documentation site.
      placeholder: README.md, "Build from source"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or fix (optional)
